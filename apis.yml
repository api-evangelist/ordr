name: Ordr
description: >-
  Ordr provides AI-powered security for connected devices, delivering a Cyber
  Asset Attack Surface Management (CAASM) platform that discovers, classifies,
  and secures IT, IoT, OT, and IoMT devices across enterprise networks. The
  platform combines device intelligence, risk and vulnerability management,
  network segmentation, and zero-trust enforcement to move organizations from
  visibility to action. Ordr integrates with existing security and networking
  infrastructure (Cisco, Palo Alto Networks, CrowdStrike, SentinelOne,
  Fortinet, Aruba, Juniper) and serves healthcare, manufacturing, financial
  services, government, and retail sectors. The company is headquartered in
  Santa Clara, California. This profile was surfaced as a portfolio company of
  Battery Ventures and enriched from Ordr's public web surface; Ordr does not
  publish a public developer API or developer portal.
